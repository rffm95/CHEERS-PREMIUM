name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # GitHub Pages is only enabled on CHEERS-PREMIUM; the cheersBar mirror is published by Netlify.
    if: github.repository == 'rffm95/CHEERS-PREMIUM'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript and prepare static site
        run: |
          node --check app.js
          node --check i18n.js
          node --check sw.js
          mkdir _site
          cp index.html style.css app.js i18n.js menu.json manifest.webmanifest sw.js .nojekyll _site/
          cp -R images icons _site/
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
